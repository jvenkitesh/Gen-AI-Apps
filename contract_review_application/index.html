<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contract Review – Trial 3</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>Contract Review <span class="header-tag">Trial 3 · JSON datasets</span></h1>
  </header>

  <main class="app-main">
    <section class="contract-panel">
      <div class="panel-header">
        <h2>Contract</h2>
      </div>

      <div id="upload-area" class="upload-area">
        <label for="file-input" class="upload-label">
          <span class="upload-icon">&#128196;</span>
          <span class="upload-text">Click to upload a PDF contract</span>
          <span class="upload-subtext">or drag and drop it here</span>
        </label>
        <input type="file" id="file-input" accept="application/pdf" hidden>
      </div>

      <div id="file-info" class="file-info" hidden>
        <span id="file-name" class="file-name"></span>
        <button id="remove-file" class="remove-file-btn" title="Remove file">&times;</button>
      </div>

      <div id="pdf-preview" class="pdf-preview" hidden>
        <embed id="pdf-embed" src="" type="application/pdf">
      </div>
    </section>

    <section class="chat-panel">
      <div class="panel-header">
        <h2>Chat</h2>
      </div>

      <div id="chat-messages" class="chat-messages">
        <div class="message assistant">
          <div class="message-bubble">
            Upload a contract and ask me anything about it. Ask for structured data (e.g. "list all clauses as JSON") and I'll render it as a table you can download.
          </div>
        </div>
      </div>

      <form id="chat-form" class="chat-input-area">
        <textarea id="chat-input" placeholder="Upload a contract to start chatting..." rows="1" autocomplete="off" disabled></textarea>
        <button type="button" id="send-btn" class="send-btn" disabled>Send</button>
        <button type="button" id="download-responses-btn" class="download-btn" hidden>Download Responses</button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
